<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PA Lottery Scratch Odds</title>
<style>
  :root {
    --bg: #f2f3f5;
    --panel: #ffffff;
    --border: #d9dde3;
    --text: #14181f;
    --text-dim: #626a76;
    --navy: #0f2540;
    --navy-2: #16344f;
    --gold: #b8860b;
    --gold-bg: #fbf1d9;
    --good: #1a7f37;
    --good-bg: #e6f4ea;
    --warn: #b45309;
    --warn-bg: #fdf0e0;
    --bad: #b91c1c;
    --bad-bg: #fbe6e6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
    font-variant-numeric: tabular-nums;
  }
  header {
    background: var(--navy);
    color: #fff;
    padding: 18px 24px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 {
    margin: 0 0 3px;
    font-size: 1.4rem;
    letter-spacing: -0.01em;
  }
  header .sub {
    color: #b7c4d3;
    font-size: 0.78rem;
    margin-bottom: 14px;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }
  .controls input[type="search"], .controls select {
    padding: 8px 11px;
    border: 1px solid #2a4a68;
    border-radius: 6px;
    font-size: 0.85rem;
    background: var(--navy-2);
    color: #fff;
  }
  .controls input[type="search"]::placeholder { color: #93a5b8; }
  .controls input[type="search"] { flex: 1 1 220px; }
  #refreshBtn {
    padding: 8px 14px;
    border: 1px solid var(--gold);
    border-radius: 6px;
    font-size: 0.85rem;
    font-weight: 600;
    background: var(--gold);
    color: #1a1400;
    cursor: pointer;
  }
  #refreshBtn:disabled { opacity: 0.55; cursor: default; }
  #refreshStatus { margin-bottom: 0; color: #d8e2ec; }

  main { max-width: 1500px; margin: 20px auto 40px; padding: 0 20px; }
  #resultBar { color: var(--text-dim); font-size: 0.8rem; margin-bottom: 8px; }

  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  thead th {
    text-align: left;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-dim);
    padding: 10px 12px;
    border-bottom: 2px solid var(--border);
    background: #f8f9fb;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  thead th.num { text-align: right; }
  thead th:hover { color: var(--text); }
  thead th .arrow { display: inline-block; width: 12px; opacity: 0.5; }
  thead th.sorted .arrow { opacity: 1; color: var(--navy); }

  tbody tr.game-row { cursor: pointer; border-bottom: 1px solid var(--border); }
  tbody tr.game-row:hover { background: #f8f9fb; }
  tbody td { padding: 8px 12px; vertical-align: middle; font-size: 0.85rem; }
  td.num { text-align: right; font-weight: 600; }
  td.thumb { width: 44px; }
  td.thumb img { width: 40px; height: 56px; object-fit: cover; border-radius: 4px; border: 1px solid var(--border); display: block; }
  td.thumb .noimg { width: 40px; height: 56px; border-radius: 4px; background: var(--border); }
  td.name-cell .name { font-weight: 600; font-size: 0.86rem; line-height: 1.2; }
  td.name-cell .gamenum { color: var(--text-dim); font-size: 0.7rem; }
  td.name-cell .new-tag { color: var(--gold); font-weight: 700; font-size: 0.65rem; margin-left: 5px; }

  .winleft-cell { min-width: 130px; }
  .winleft-text { font-size: 0.78rem; display: flex; justify-content: space-between; margin-bottom: 3px; }
  .winleft-text b { font-weight: 700; }
  .bar { background: var(--border); border-radius: 999px; height: 5px; overflow: hidden; }
  .bar-fill { background: var(--good); height: 100%; }
  .bar-fill.mid { background: var(--warn); }
  .bar-fill.low { background: var(--bad); }

  tr.detail-row { display: none; }
  tr.detail-row.open { display: table-row; }
  tr.detail-row td { padding: 0; background: #fafbfc; border-bottom: 1px solid var(--border); }
  .detail-wrap { padding: 14px 18px 18px 66px; }
  .detail-wrap table { border: none; }
  .detail-wrap thead th { background: transparent; font-size: 0.65rem; cursor: default; padding: 4px 10px; }
  .detail-wrap thead th:hover { color: var(--text-dim); }
  .detail-wrap tbody td { padding: 4px 10px; font-size: 0.8rem; border-bottom: 1px dashed var(--border); }
  .detail-wrap tbody tr:last-child td { border-bottom: none; }
  .detail-wrap tr.untracked td { color: var(--text-dim); }
  .detail-wrap .flag { color: var(--warn); }
  .detail-foot { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-top: 10px; flex-wrap: wrap; }
  .detail-note { font-size: 0.72rem; color: var(--text-dim); max-width: 620px; line-height: 1.4; }
  .detail-links { font-size: 0.78rem; white-space: nowrap; }
  .detail-links a { color: var(--navy); font-weight: 600; text-decoration: none; margin-left: 12px; }
  .detail-links a:hover { text-decoration: underline; }

  footer { max-width: 1500px; margin: 18px auto 30px; padding: 0 20px; color: var(--text-dim); font-size: 0.72rem; line-height: 1.5; }

  /* ---------- mobile: plain, stacked, to the point ---------- */
  @media (max-width: 700px) {
    header { padding: 14px 16px; }
    header h1 { font-size: 1.2rem; }
    header .sub { font-size: 0.72rem; }
    .controls input[type="search"] { flex: 1 1 100%; }
    #refreshBtn { flex: 1 1 auto; }
    main { padding: 0 10px; margin: 14px auto 30px; }

    table, thead, tbody { display: block; width: 100%; }
    thead { display: none; }
    tbody tr.game-row {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      padding: 10px 10px 12px;
      border-bottom: 1px solid var(--border);
    }
    td.thumb { display: block; width: 40px; flex: 0 0 40px; padding: 0; }
    td.thumb img, td.thumb .noimg { width: 40px; height: 56px; }
    td.name-cell { display: block; flex: 1 1 calc(100% - 50px); padding: 0 0 6px 10px; }
    td.num {
      display: block;
      flex: 1 1 46%;
      padding: 6px 0 0;
      font-size: 0.82rem;
      text-align: left;
    }
    td.num::before {
      content: attr(data-label);
      display: block;
      color: var(--text-dim);
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      font-weight: 600;
      margin-bottom: 1px;
    }
    td.winleft-cell { flex: 1 1 100%; min-width: 0; }

    tr.detail-row td { padding: 0; }
    .detail-wrap { padding: 10px 0 14px; }
    .detail-wrap table, .detail-wrap thead, .detail-wrap tbody, .detail-wrap tr, .detail-wrap td { display: revert; }
    .detail-wrap thead { display: table-header-group; }
    .detail-scroll { overflow-x: auto; padding: 0 12px; }
    .detail-wrap table { min-width: 480px; }
    .detail-foot { flex-direction: column; padding: 0 12px; }
    .detail-links a { margin-left: 0; margin-right: 14px; }
  }
</style>
</head>
<body>

<header>
  <h1>PA Lottery Scratch Odds</h1>
  <div class="sub" id="freshness">Loading…</div>
  <div class="controls">
    <input type="search" id="search" placeholder="Search by name or game number…">
    <select id="priceFilter"><option value="">All prices</option></select>
    <button id="refreshBtn" type="button">Refresh Data</button>
    <span class="sub" id="refreshStatus"></span>
  </div>
</header>

<main>
  <div id="resultBar"></div>
  <table>
    <thead>
      <tr>
        <th style="width:44px"></th>
        <th data-key="name">Game <span class="arrow">↕</span></th>
        <th data-key="price" class="num">Price <span class="arrow">↕</span></th>
        <th data-key="overall_odds_published" class="num">Total Game Odds <span class="arrow">↕</span></th>
        <th data-key="top6_adjusted_odds_now" class="num">Correct Odds <span class="arrow">↕</span></th>
        <th data-key="top_prize_amount" class="num">Top Prize <span class="arrow">↕</span></th>
        <th data-key="pct_top_prizes_remaining" class="num">Winners Left <span class="arrow">↕</span></th>
        <th data-key="value_score_pct" class="num">Value Score <span class="arrow">↕</span></th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</main>

<footer id="footerNote"></footer>

<script>
let GAMES = [];
let META = {};
const state = { search: "", price: "", sortKey: "value_score_pct", sortDir: -1, open: new Set() };

async function load() {
  const res = await fetch('/api/games.json');
  const data = await res.json();
  META = data;
  GAMES = data.games || [];
  buildPriceOptions();
  renderFreshness();
  render();
}

function renderFreshness() {
  const el = document.getElementById('freshness');
  const scraped = META.scraped_at ? new Date(META.scraped_at).toLocaleString() : 'unknown';
  const remain = META.prizes_remaining_as_of || 'unknown';
  el.textContent = `${META.game_count || 0} active games · pulled ${scraped} · winners-left figures as of ${remain}`;
  document.getElementById('footerNote').innerHTML =
    `Unofficial, independently built — not affiliated with or endorsed by the Pennsylvania Lottery. Data is scraped from ` +
    `public palottery.pa.gov pages and may lag the live site by up to a day. ` +
    `<b>Total Game Odds</b> = the official published odds of winning any prize. ` +
    `<b>Correct Odds</b> = odds recalculated right now from the exact original ticket count (each game's official ` +
    `Pennsylvania Bulletin filing) and the live remaining count, for the 6 prize tiers PA Lottery tracks in real time — ` +
    `exact, not estimated, but only covers those 6 tiers since smaller prizes aren't publicly tracked live. ` +
    `<b>Value Score</b> = expected payout per ticket right now, as a % of price — the higher the number, the more of ` +
    `your money you'd expect back on average. Uses today's live remaining counts for the 6 tracked tiers; smaller ` +
    `prize tiers (not live-tracked) are assumed to still be at their original day-one count, since there's no live ` +
    `figure for those — a documented assumption that can only overstate value slightly, never understate it.`;
}

function buildPriceOptions() {
  const prices = [...new Set(GAMES.map(g => g.price).filter(p => p != null))].sort((a, b) => a - b);
  const sel = document.getElementById('priceFilter');
  prices.forEach(p => {
    const opt = document.createElement('option');
    opt.value = p; opt.textContent = `$${p}`;
    sel.appendChild(opt);
  });
}

document.getElementById('priceFilter').addEventListener('change', e => { state.price = e.target.value; render(); });
let searchTimer;
document.getElementById('search').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { state.search = e.target.value.trim().toLowerCase(); render(); }, 150);
});

document.querySelectorAll('thead th[data-key]').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.key;
    if (state.sortKey === key) state.sortDir *= -1;
    else { state.sortKey = key; state.sortDir = (key === 'overall_odds_published' || key === 'top6_adjusted_odds_now') ? 1 : -1; }
    render();
  });
});

function cmp(a, b, key, dir) {
  let av = a[key], bv = b[key];
  if (key === 'name') { av = (a.name || '').toLowerCase(); bv = (b.name || '').toLowerCase(); }
  if (av == null && bv == null) return 0;
  if (av == null) return 1;   // nulls always sort last regardless of direction
  if (bv == null) return -1;
  if (av < bv) return -1 * dir;
  if (av > bv) return 1 * dir;
  return 0;
}

function money(n) { return n == null ? '—' : '$' + n.toLocaleString(); }
function oddsText(n) { return n == null ? '—' : `1 in ${n.toLocaleString(undefined, { maximumFractionDigits: 2 })}`; }

function render() {
  let list = GAMES.filter(g => {
    if (state.search) {
      const hay = `${g.name || ''} ${g.game_number || ''}`.toLowerCase();
      if (!hay.includes(state.search)) return false;
    }
    if (state.price !== "" && g.price !== Number(state.price)) return false;
    return true;
  });
  list.sort((a, b) => cmp(a, b, state.sortKey, state.sortDir));

  document.getElementById('resultBar').textContent = `${list.length} game${list.length === 1 ? '' : 's'}`;

  document.querySelectorAll('thead th[data-key]').forEach(th => {
    const on = th.dataset.key === state.sortKey;
    th.classList.toggle('sorted', on);
    th.querySelector('.arrow').textContent = on ? (state.sortDir === 1 ? '↑' : '↓') : '↕';
  });

  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  list.forEach(g => {
    tbody.appendChild(renderRow(g));
    tbody.appendChild(renderDetailRow(g));
  });
}

function pctClass(pct) {
  // Buckets are based on % of top prizes REMAINING: >=51% green, 26-50% yellow, <=25% red.
  if (pct == null) return '';
  if (pct <= 25) return 'low';
  if (pct < 51) return 'mid';
  return '';
}

function renderRow(g) {
  const tr = document.createElement('tr');
  tr.className = 'game-row';
  tr.dataset.id = g.id;
  const pct = g.pct_top_prizes_remaining;
  tr.innerHTML = `
    <td class="thumb">${g.images && g.images.cover ? `<img src="/${g.images.cover}" alt="" loading="lazy">` : `<div class="noimg"></div>`}</td>
    <td class="name-cell">
      <div class="name">${g.name || 'Unnamed game'}${g.badges && g.badges.new ? '<span class="new-tag">NEW</span>' : ''}</div>
      <div class="gamenum">${g.game_number || ''}</div>
    </td>
    <td class="num" data-label="Price">$${g.price ?? '?'}</td>
    <td class="num" data-label="Total Game Odds">${oddsText(g.overall_odds_published)}</td>
    <td class="num" data-label="Correct Odds">${oddsText(g.top6_adjusted_odds_now)}</td>
    <td class="num" data-label="Top Prize">${money(g.top_prize_amount)}</td>
    <td class="num winleft-cell" data-label="Winners Left">
      <div class="winleft-text"><span>${g.top_prize_remaining ?? '?'} of ${g.top_prize_original ?? '?'}</span><b>${pct == null ? '—' : pct + '%'}</b></div>
      <div class="bar"><div class="bar-fill ${pctClass(pct)}" style="width:${pct == null ? 0 : 100 - pct}%"></div></div>
    </td>
    <td class="num" data-label="Value Score">${g.value_score_pct == null ? '—' : g.value_score_pct + '%'}</td>
  `;
  tr.addEventListener('click', () => toggleDetail(g.id));
  return tr;
}

function renderDetailRow(g) {
  const tr = document.createElement('tr');
  tr.className = 'detail-row';
  tr.id = `detail-${g.id}`;
  if (state.open.has(g.id)) tr.classList.add('open');
  const td = document.createElement('td');
  td.colSpan = 8;
  const tiersRows = (g.tiers || []).map(t => `
    <tr class="${t.tracked_live ? '' : 'untracked'}">
      <td>${money(t.amount)}</td>
      <td>${t.original != null ? t.original.toLocaleString() : '—'}${t.original_understated ? ' <span class="flag">*</span>' : ''}</td>
      <td>${t.tracked_live ? (t.remaining != null ? t.remaining.toLocaleString() : '—') : 'not tracked live'}</td>
      <td>${t.tracked_live ? oddsText(t.adjusted_odds_now) : oddsText(t.published_odds)}</td>
    </tr>`).join('');
  td.innerHTML = `
    <div class="detail-wrap">
      <div class="detail-scroll">
        <table>
          <thead><tr><th>Prize</th><th>Total prizes</th><th>Winners left (live)</th><th>Correct odds</th></tr></thead>
          <tbody>${tiersRows}</tbody>
        </table>
      </div>
      <div class="detail-foot">
        <div class="detail-note">
          "Total prizes" is each tier's original count from the game's official state filing. Rows marked
          "not tracked live" show published odds only — PA Lottery doesn't publish live remaining counts below
          the top 6 tiers. <span class="flag">*</span> = this tier's live remaining count is higher than the
          state's pre-launch estimate (production sometimes runs larger than announced for common prize tiers) —
          Correct Odds is unaffected since it's computed straight from total tickets printed and today's remaining count.
        </div>
        <div class="detail-links">
          ${g.detail_url ? `<a href="${g.detail_url}" target="_blank" rel="noopener">Official page ↗</a>` : ''}
          ${g.bulletin_url ? `<a href="${g.bulletin_url}" target="_blank" rel="noopener">Official filing ↗</a>` : ''}
        </div>
      </div>
    </div>
  `;
  tr.appendChild(td);
  return tr;
}

function toggleDetail(id) {
  if (state.open.has(id)) state.open.delete(id); else state.open.add(id);
  const row = document.getElementById(`detail-${id}`);
  if (row) row.classList.toggle('open');
}

const refreshBtn = document.getElementById('refreshBtn');
const refreshStatus = document.getElementById('refreshStatus');

async function startRefresh() {
  refreshBtn.disabled = true;
  refreshStatus.textContent = 'Refreshing… usually takes 2–3 min';
  try {
    const res = await fetch('/api/refresh', { method: 'POST' });
    if (res.status === 409) {
      refreshStatus.textContent = 'Already refreshing (started elsewhere)… waiting for it to finish';
    } else if (!res.ok) {
      throw new Error(`refresh request failed: ${res.status}`);
    }
  } catch (e) {
    refreshStatus.textContent = 'Could not start refresh — try again';
    refreshBtn.disabled = false;
    return;
  }
  pollRefresh();
}

async function pollRefresh(attempt = 0) {
  let running = true;
  try {
    const res = await fetch('/api/refresh-status');
    const data = await res.json();
    running = data.running;
  } catch (e) {
    running = true; // network hiccup — keep waiting rather than declaring done early
  }
  // Ignore "not running" on the first couple of checks in case we're polling
  // before the freshly-spawned scraper has written its lock file yet.
  if (running || attempt < 2) {
    setTimeout(() => pollRefresh(attempt + 1), 3000);
    return;
  }
  refreshStatus.textContent = 'Done — reloading…';
  await load();
  refreshBtn.disabled = false;
  refreshStatus.textContent = '';
}

refreshBtn.addEventListener('click', startRefresh);

load();
</script>
</body>
</html>
